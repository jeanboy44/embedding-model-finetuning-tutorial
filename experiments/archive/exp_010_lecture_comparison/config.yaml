# exp_010: 강의 실습 3 비교표 (학습 없음, e5만). 학습 전 / 001 / 004 / 005 / 002(다시 캔 오답 3개)을 test로 비교한다.
# 실행: ragkit compare --config experiments/archive/exp_010_lecture_comparison/config.yaml
# 2026-10-06 강사 결정으로 EmbeddingGemma는 강의에서 뺐다. 젬마가 든 비교는 exp_005·exp_007(기록)을 본다.
# 모델 폴더는 강사가 학습해 나눠 준다 (models/finetuned/ 아래).
name: lecture_comparison
questions: data/splits/test.jsonl
models:
  - intfloat/multilingual-e5-small   # 학습 전
  - models/finetuned/001_baseline         # 전체 학습, LLM이 고른 오답 1개
  - models/finetuned/004_lora         # LoRA
  - models/finetuned/005_batch128         # 배치 128
  - models/finetuned/002_hard_negatives          # 다시 캔 오답 3개 (experiments/002_hard_negatives)
