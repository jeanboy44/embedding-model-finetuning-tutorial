# exp_007: 파인튜닝 최종 비교 (학습 없음). base e5 / Gemma / 001 / 004 / 005를 test로 평가한다.
# 실행: ragkit compare --config experiments/archive/exp_007_finetune_comparison/config.yaml  (전체 실험은 just finetune-suite)
# 결과: experiments/archive/exp_007_finetune_comparison/results/comparison.md (주요 지표 R@5, 데이터 버전 포함)
name: finetune_comparison
questions: data/splits/test.jsonl
models:
  - intfloat/multilingual-e5-small   # 파인튜닝 전
  - google/embeddinggemma-300m       # 큰 모델 기준선
  - models/finetuned/001_baseline         # 전체 학습, 배치 32
  - models/finetuned/004_lora         # LoRA, 배치 32
  - models/finetuned/005_batch128         # 전체 학습, 배치 128
