# 001 run B: 채굴 negative 3개 (95% 이상은 Claude 판정: no만 negative, full은 학습 행 추가). 02_plan.md 참고
name: r001_B
training:
  model: intfloat/multilingual-e5-small
  output_dir: models/finetuned/r001_B
  batch_size: 32
  loss: cached_mnrl
  mini_batch_size: 16
  attention_dropout: 0.0
  epochs: 4
  lr: 3.0e-5
  warmup_ratio: 0.1
  max_seq_length: 512
  num_negatives: 3
  seed: 42
  dev_labels: data/labels/dev.jsonl
  train_eval_sample: 800
  negatives_file: runs/001_hard_negatives/artifacts/negatives_B.jsonl
