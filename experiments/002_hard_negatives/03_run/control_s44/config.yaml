# 001 대조군 (seed 44): 기존 LLM hard negative 1개. A·B·C와 같은 코드·같은 최대 epoch(4)로 다시 학습한다 (계획 검토 반영)
name: r001_control_s44
training:
  model: intfloat/multilingual-e5-small
  output_dir: models/finetuned/r001_control_s44
  batch_size: 32
  loss: cached_mnrl
  mini_batch_size: 16
  attention_dropout: 0.0
  epochs: 4
  lr: 3.0e-5
  warmup_ratio: 0.1
  max_seq_length: 512
  num_negatives: 1
  seed: 44
  dev_labels: data/labels/dev.jsonl
  train_eval_sample: 800
