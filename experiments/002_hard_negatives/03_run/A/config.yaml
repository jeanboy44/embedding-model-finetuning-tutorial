# 001 run A: 채굴 negative 3개 (정답 점수 95% 이상은 판정 없이 버림). 02_plan.md 참고
name: r001_A
training:
  model: intfloat/multilingual-e5-small
  output_dir: models/finetuned/r001_A
  batch_size: 32
  loss: cached_mnrl
  mini_batch_size: 16
  attention_dropout: 0.0
  epochs: 4
  lr: 3.0e-5
  warmup_ratio: 0.1
  max_seq_length: 512
  num_negatives: 3
  seed: 42
  dev_labels: data/labels/dev.jsonl
  train_eval_sample: 800
  negatives_file: runs/001_hard_negatives/artifacts/negatives_A.jsonl
