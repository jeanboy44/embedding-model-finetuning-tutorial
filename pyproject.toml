[project]
name = "slm-finetuning-example"
version = "0.1.0"
description = "Educational repository for embedding fine-tuning and RAG"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "langchain>=0.1.0",
    "langgraph>=0.0.1",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "google-genai>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "numpy>=1.24.0",
    "polars>=1.0.0",
    "scikit-learn>=1.3.0",
    "cyclopts>=3.0.0",
    "loguru>=0.7.0",
    "pyyaml>=6.0",
    "huggingface-hub>=0.24",
    "gdown>=5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.15",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "experiments*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
