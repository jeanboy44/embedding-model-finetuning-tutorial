[project]
name = "ragkit"
version = "0.1.0"
description = "임베딩 검색 기반 RAG 서비스 패키지 (임베딩 파인튜닝 강의용)"
readme = "README.md"
requires-python = ">=3.10"
# 배포 기본값: ONNX 추론. torch/학습 도구는 extra로 분리해 배포 크기를 줄인다.
dependencies = [
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "google-genai>=1.0.0",
    "cyclopts>=3.0.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
# PyTorch 추론 백엔드
torch = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
]
# 학습·평가·ONNX 변환 (배포에는 포함하지 않는다)
train = [
    "ragkit[torch]",
    "sentence-transformers>=3.0",
    "peft>=0.11",
    "datasets>=2.19",
    "pyyaml>=6.0",
    "onnx>=1.16",
]

[project.scripts]
ragkit = "ragkit.cli.cli_tool:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.15",
]
# 저장소 안에서만 쓰는 튜토리얼·데이터 준비 스크립트용
tutorial = [
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "huggingface-hub>=0.24",
    "gdown>=5.2",
]

[tool.uv]
default-groups = ["dev", "tutorial"]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"
