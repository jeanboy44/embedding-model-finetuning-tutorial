[project]
name = "ragkit-bench"
version = "0.1.0"
description = "원본(torch) / ONNX / INT8 모델의 속도·메모리·크기·정확도 비교 (3단계)"
requires-python = ">=3.10"
dependencies = [
    "ragkit[torch]",
    "cyclopts>=3.0.0",
    "packaging>=23",
]

[project.optional-dependencies]
# MLflow 실험 추적 (MLFLOW_TRACKING_URI를 주면 변형마다 run을 남긴다)
mlflow = ["ragkit[mlflow]"]

[project.scripts]
ragkit-bench = "ragkit_bench:main"

[tool.uv.sources]
ragkit = { workspace = true }

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"
