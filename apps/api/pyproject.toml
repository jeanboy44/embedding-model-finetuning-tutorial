[project]
name = "ragkit-api"
version = "0.1.0"
description = "ragkit 검색 API (FastAPI)"
requires-python = ">=3.10"
dependencies = [
    "ragkit",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
# 2단계: torch 백엔드로 띄우기 (3단계에서 ONNX 기본 설치와 크기·속도를 비교한다)
torch = ["ragkit[torch]"]
# 4단계: MLflow 트레이싱 (MLFLOW_TRACKING_URI를 주면 요청마다 트레이스를 남긴다)
tracing = ["ragkit[tracing]"]

[project.scripts]
ragkit-api = "ragkit_api:main"

[tool.uv.sources]
ragkit = { workspace = true }

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"
