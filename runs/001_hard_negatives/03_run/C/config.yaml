# 001 run C: A와 같은 채굴 negative에서 1위 1개만 쓴다 (A가 B보다 높아 A 기준). 출처(채굴)와 개수(1→3)의 효과를 분리한다
name: r001_C
training:
  model: intfloat/multilingual-e5-small
  output_dir: models/finetuned/r001_C
  batch_size: 32
  loss: cached_mnrl
  mini_batch_size: 16
  attention_dropout: 0.0
  epochs: 4
  lr: 3.0e-5
  warmup_ratio: 0.1
  max_seq_length: 512
  num_negatives: 1
  seed: 42
  dev_labels: data/labels/dev.jsonl
  train_eval_sample: 800
  negatives_file: runs/001_hard_negatives/artifacts/negatives_A.jsonl
