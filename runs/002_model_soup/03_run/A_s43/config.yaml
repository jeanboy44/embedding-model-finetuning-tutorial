# 002: 001 run A와 같은 설정, seed 43 (확증 run 기본 seed 2개, 가중치 평균 재료)
name: r002_A_s43
training:
  model: intfloat/multilingual-e5-small
  output_dir: models/finetuned/r002_A_s43
  batch_size: 32
  loss: cached_mnrl
